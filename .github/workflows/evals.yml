# 单元测试 + 黄金评测门禁
name: evals

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  unit-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 单元测试
        run: pytest -q
      # stub + 当前 PROMPT_PIN（默认 current）。不要在此跑 compare_prompt_versions（会打两次模型）。
      - name: 黄金评测门禁
        run: python evals/run_evals.py
        env:
          PROMPT_PIN: current
      - name: 红队集门禁（注入/越权）
        run: python evals/run_redteam.py
