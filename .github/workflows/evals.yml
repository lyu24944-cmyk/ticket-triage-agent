# 单元测试 + 黄金评测门禁
name: evals

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  unit-and-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 单元测试
        run: pytest -q
      - name: 黄金评测门禁
        run: python evals/run_evals.py
