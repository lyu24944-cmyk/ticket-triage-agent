# 网关：TLS 终结 + 速率限制 + 请求体上限。上游只有一个 API 进程，不要 scale。
# 口径与 src/ticket_triage/limits.py 的 MAX_BODY_BYTES=64000 对齐。
daemon off;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 与应用 middleware 同口径；超限网关直接 413，不进 uvicorn。
    client_max_body_size 64000;
    client_body_buffer_size 64000;

    limit_req_zone $binary_remote_addr zone=triage_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=triage_runs:10m rate=20r/m;
    limit_req_status 429;

    upstream ticket_triage_api {
        server api:8000;
        keepalive 8;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # 就绪检查：宽松限流，方便编排探针
        location = /health {
            limit_req zone=triage_general burst=30 nodelay;
            proxy_pass http://ticket_triage_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 精确匹配 POST /runs（受理）。GET /runs/{id} 走下方通用 location。
        location = /runs {
            limit_req zone=triage_runs burst=10 nodelay;
            proxy_pass http://ticket_triage_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location / {
            limit_req zone=triage_general burst=40 nodelay;
            proxy_pass http://ticket_triage_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Key $http_x_api_key;
        }
    }
}
