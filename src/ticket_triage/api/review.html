<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工单审核台</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 15px/1.5 "Segoe UI", sans-serif; background: #f4f5f7; color: #1c1e21; }
    header { padding: 16px 24px; background: #1f2933; color: #fff; }
    header p { margin: 4px 0 0; color: #c5ced6; font-size: 13px; }
    main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px; }
    section { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; font-size: 13px; margin: 8px 0 4px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cfd4da; border-radius: 6px; font: inherit; }
    button { margin-top: 8px; margin-right: 8px; padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
    button.primary { background: #1f7a4d; color: #fff; }
    button.danger { background: #a33b3b; color: #fff; }
    button.quiet { background: #e8ebef; }
    ul { list-style: none; padding: 0; margin: 0 0 16px; max-height: 220px; overflow: auto; }
    li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    li.active { background: #eef6f1; }
    .meta { color: #5c6770; font-size: 13px; }
    .empty { color: #5c6770; }
    .warning { color: #8a5a00; background: #fff7df; border-left: 3px solid #d89b19; padding: 8px 10px; }
    pre { white-space: pre-wrap; background: #f7f8fa; padding: 12px; border-radius: 6px; }
    .hit { border-left: 3px solid #1f7a4d; padding-left: 10px; margin: 8px 0; }
    .error { color: #a33b3b; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>工单审核台</strong>
    <p>模型写草稿。通过后才结案，驳回则升级。</p>
  </header>
  <main>
    <section>
      <h2>审核身份</h2>
      <p class="meta" id="auth-mode-meta">正在读取鉴权模式…</p>
      <div id="mint-panel">
        <label>审核引导密钥（换 JWT）</label>
        <input id="review-key" type="password" autocomplete="off" />
        <label>审核人（JWT sub）</label>
        <input id="reviewer" maxlength="64" />
        <button class="quiet" id="login" type="button">登录领取令牌</button>
      </div>
      <div id="oidc-panel" hidden>
        <label>IdP 访问令牌（Bearer）</label>
        <input id="oidc-token" type="password" autocomplete="off" placeholder="粘贴 IdP 签发的 access_token" />
        <button class="quiet" id="oidc-login" type="button">使用 IdP 令牌</button>
      </div>
      <p id="auth-error" class="error"></p>
      <p class="meta" id="token-meta"></p>
      <h2>待审</h2>
      <ul id="queue"></ul>
      <p id="empty" class="empty">没有待审工单。</p>
      <h2>已处理</h2>
      <ul id="closed"></ul>
      <p id="closed-empty" class="empty">没有已处理工单。</p>
      <h2>新建工单</h2>
      <label>受理密钥</label>
      <input id="service-key" type="password" autocomplete="off" />
      <label>主题</label>
      <input id="subject" value="紧急退款" />
      <label>正文</label>
      <textarea id="body" rows="3">我被重复扣款，需要退款</textarea>
      <button class="quiet" id="create">创建并送审</button>
      <p id="create-error" class="error"></p>
    </section>
    <section id="detail">
      <h2>请选择一张工单</h2>
    </section>
  </main>
  <script>
    const queue = document.getElementById("queue");
    const empty = document.getElementById("empty");
    const closedList = document.getElementById("closed");
    const closedEmpty = document.getElementById("closed-empty");
    const detail = document.getElementById("detail");
    const STATUS = { resolved: "已结案", escalated: "已升级", pending: "重新送审", open: "新建" };
    const keyInput = document.getElementById("review-key");
    const serviceInput = document.getElementById("service-key");
    const reviewerInput = document.getElementById("reviewer");
    const oidcTokenInput = document.getElementById("oidc-token");
    const mintPanel = document.getElementById("mint-panel");
    const oidcPanel = document.getElementById("oidc-panel");
    keyInput.value = sessionStorage.getItem("review_api_key") || "";
    serviceInput.value = sessionStorage.getItem("service_api_key") || "";
    reviewerInput.value = sessionStorage.getItem("reviewer_name") || "";
    oidcTokenInput.value = sessionStorage.getItem("review_access_token") || "";
    let reviewToken = sessionStorage.getItem("review_access_token") || "";
    let authMode = "mint";
    keyInput.addEventListener("change", () => {
      sessionStorage.setItem("review_api_key", keyInput.value.trim());
    });
    reviewerInput.addEventListener("change", () => {
      sessionStorage.setItem("reviewer_name", reviewerInput.value.trim());
    });
    serviceInput.addEventListener("change", () => {
      sessionStorage.setItem("service_api_key", serviceInput.value.trim());
    });

    async function loadAuthMode() {
      try {
        const response = await fetch("/auth/review/mode");
        const body = await response.json().catch(() => ({}));
        authMode = body.mode === "oidc" ? "oidc" : "mint";
      } catch (_) {
        authMode = "mint";
      }
      mintPanel.hidden = authMode === "oidc";
      oidcPanel.hidden = authMode !== "oidc";
      const meta = document.getElementById("auth-mode-meta");
      if (authMode === "oidc") {
        meta.textContent = "OIDC 已开启：mint 关闭，请粘贴 IdP 令牌。无有效令牌不能人审。";
      } else {
        meta.textContent = "本地 mint：用审核引导密钥换短时人员 JWT。";
      }
    }
    loadAuthMode();

    function serviceHeaders() {
      const headers = { "Content-Type": "application/json" };
      const key = serviceInput.value.trim();
      sessionStorage.setItem("service_api_key", key);
      if (key) headers["X-API-Key"] = key;
      return headers;
    }

    function serviceError(body) {
      const code = (body.errors || [])[0];
      if (code === "service_auth_not_configured") return "服务还没有配置 SERVICE_API_KEY。";
      if (code === "service_auth_failed") return "受理密钥不正确。";
      return (body.errors || ["创建失败"]).join(" ");
    }

    function reviewerName() {
      const name = reviewerInput.value.trim();
      sessionStorage.setItem("reviewer_name", name);
      return name;
    }

    function authHeaders(extra) {
      const headers = Object.assign({}, extra || {});
      if (reviewToken) headers["Authorization"] = "Bearer " + reviewToken;
      return headers;
    }

    function showAuth(body) {
      const code = (body.errors || [])[0];
      const map = {
        review_auth_not_configured: "服务还没有配置 REVIEW_API_KEY。",
        review_auth_failed: "审核引导密钥不正确。",
        review_token_missing: authMode === "oidc" ? "请先粘贴 IdP 人员令牌。" : "请先登录领取人员令牌。",
        review_token_expired: "人员令牌已过期，请重新登录。",
        review_jwt_not_configured: "服务还没有配置审核 JWT。",
        review_mint_disabled: "OIDC 已开启，mint 已关闭，请使用 IdP 令牌。",
        review_oidc_jwks: "无法拉取 IdP JWKS，请检查 REVIEW_OIDC_*。",
      };
      document.getElementById("auth-error").textContent = map[code] || "人员令牌无效，请重新登录。";
      document.getElementById("token-meta").textContent = "";
    }

    function clearAuth() {
      document.getElementById("auth-error").textContent = "";
    }

    document.getElementById("login").onclick = async () => {
      clearAuth();
      const sub = reviewerName();
      const key = keyInput.value.trim();
      if (!sub || !key) {
        document.getElementById("auth-error").textContent = "请填写审核引导密钥和审核人。";
        return;
      }
      const response = await fetch("/auth/review/token", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": key },
        body: JSON.stringify({ sub }),
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        showAuth(body);
        return;
      }
      reviewToken = body.access_token || "";
      sessionStorage.setItem("review_access_token", reviewToken);
      document.getElementById("token-meta").textContent = "已登录：" + (body.sub || sub);
      await load();
      await loadClosed();
    };

    document.getElementById("oidc-login").onclick = async () => {
      clearAuth();
      let raw = oidcTokenInput.value.trim();
      if (raw.toLowerCase().startsWith("bearer ")) raw = raw.slice(7).trim();
      if (!raw) {
        document.getElementById("auth-error").textContent = "请粘贴 IdP 访问令牌。";
        return;
      }
      reviewToken = raw;
      sessionStorage.setItem("review_access_token", reviewToken);
      document.getElementById("token-meta").textContent = "已使用 IdP 令牌";
      await load();
      await loadClosed();
    };
    let selected = null;
    let selectedKind = null;
    let items = [];
    let closedItems = [];

    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
      }[ch]));
    }

    async function load() {
      const response = await fetch("/runs/pending", { headers: authHeaders() });
      if (response.status === 401) {
        showAuth(await response.json());
        items = [];
        queue.innerHTML = "";
        empty.hidden = false;
        return;
      }
      clearAuth();
      items = await response.json();
      queue.innerHTML = "";
      empty.hidden = items.length > 0;
      for (const item of items) {
        const li = document.createElement("li");
        li.dataset.id = item.ticket_id;
        if (item.ticket_id === selected) li.className = "active";
        li.innerHTML = `<strong>${esc(item.subject)}</strong><div class="meta">${esc(item.ticket_id)} · ${esc(item.category)} / ${esc(item.priority)}</div>`;
        li.onclick = () => show(item.ticket_id);
        queue.appendChild(li);
      }
      if (selectedKind === "pending" && selected && !items.some((item) => item.ticket_id === selected)) {
        selected = null;
        selectedKind = null;
        detail.innerHTML = "<h2>请选择一张工单</h2>";
      }
    }

    async function loadClosed() {
      const response = await fetch("/tickets", { headers: authHeaders() });
      if (response.status === 401) {
        showAuth(await response.json());
        closedItems = [];
        closedList.innerHTML = "";
        closedEmpty.hidden = false;
        return;
      }
      clearAuth();
      closedItems = await response.json();
      closedList.innerHTML = "";
      closedEmpty.hidden = closedItems.length > 0;
      for (const item of closedItems) {
        const li = document.createElement("li");
        li.dataset.id = item.ticket_id;
        if (selectedKind === "closed" && item.ticket_id === selected) li.className = "active";
        li.innerHTML = `<strong>${esc(item.subject)}</strong><div class="meta">${esc(item.ticket_id)} · ${esc(STATUS[item.status] || item.status)}</div>`;
        li.onclick = () => showClosed(item.ticket_id);
        closedList.appendChild(li);
      }
    }

    function showClosed(ticketId) {
      selected = ticketId;
      selectedKind = "closed";
      const item = closedItems.find((row) => row.ticket_id === ticketId);
      if (!item) return;
      const history = (item.history || []).map((entry) => {
        const who = entry.reviewer ? " · " + esc(entry.reviewer) : "";
        return `${esc(STATUS[entry.status] || entry.status)}${who}${entry.note ? " · " + esc(entry.note) : ""}`;
      }).join("\n");
      detail.innerHTML = `
        <h2>${esc(item.subject)}</h2>
        <p class="meta">${esc(item.ticket_id)} · ${esc(STATUS[item.status] || item.status)}</p>
        <p>${esc(item.body)}</p>
        <h2>状态历史</h2>
        <pre>${history || "没有历史。"}</pre>
        <button class="primary" id="reopen">重新送审</button>
        <p id="action-error" class="error"></p>
      `;
      document.querySelectorAll("#queue li").forEach((li) => { li.className = ""; });
      document.querySelectorAll("#closed li").forEach((li) => {
        li.className = li.dataset.id === ticketId ? "active" : "";
      });
      document.getElementById("reopen").onclick = () => sendBack(ticketId);
    }

    async function sendBack(ticketId) {
      if (!reviewToken) {
        document.getElementById("action-error").textContent = "请先登录领取人员令牌。";
        return;
      }
      const response = await fetch("/tickets/" + encodeURIComponent(ticketId) + "/reopen", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({})
      });
      const result = await response.json();
      if (response.status === 401) {
        showAuth(result);
        return;
      }
      if (!response.ok || !result.awaiting_human) {
        document.getElementById("action-error").textContent = (result.errors || ["重新送审失败"]).join(" ");
        return;
      }
      await load();
      await loadClosed();
      show(ticketId);
    }

    async function show(ticketId) {
      selected = ticketId;
      selectedKind = "pending";
      const item = items.find((row) => row.ticket_id === ticketId);
      if (!item) return;
      const traceResponse = await fetch("/traces/" + encodeURIComponent(item.trace_id), { headers: authHeaders() });
      const trace = traceResponse.ok ? await traceResponse.json() : { spans: [] };
      const spans = (trace.spans || []).map((span) =>
        `${esc(span.node)} · ${esc(span.status)} · ${Number(span.duration_ms).toFixed(1)} ms`
      ).join("\n");
      const hits = (item.kb_hits || []).map((hit) =>
        `<div class="hit"><strong>${esc(hit.title)}</strong> <span class="meta">${esc(hit.id)}</span><div>${esc(hit.body)}</div></div>`
      ).join("") || "<p class=\"empty\">没有引用。</p>";
      const modelWarnings = (item.errors || []).filter((error) =>
        error.startsWith("classify_model_failed")
        || error.startsWith("draft_model_failed")
        || error.startsWith("act_model_failed")
      ).map((error) => {
        if (error.startsWith("classify_model_failed")) return "分类模型失败，当前分类由关键词规则生成。";
        if (error.startsWith("act_model_failed")) return "工具调度模型失败，已改用固定规则选择工具。";
        return "草稿模型失败，当前草稿由 stub 生成。";
      });
      const toolRows = (item.tool_calls || []).map((call) => {
        const flag = call.ok ? "成功" : "失败";
        const reason = call.error ? ` · ${esc(call.error)}` : "";
        return `<li>${esc(call.name)} · ${flag}${reason}</li>`;
      }).join("") || "<li class=\"empty\">没有工具调用。</li>";
      const warningMarkup = modelWarnings.length
        ? `<p class="warning">${modelWarnings.map(esc).join("<br>")}</p>`
        : "";
      detail.innerHTML = `
        <h2>${esc(item.subject)}</h2>
        <p class="meta">${esc(item.ticket_id)} · ${esc(item.category)} / ${esc(item.priority)}</p>
        ${warningMarkup}
        <p>${esc(item.body)}</p>
        <h2>本次工具调用</h2>
        <ul>${toolRows}</ul>
        <h2>草稿</h2>
        <pre>${esc(item.draft_body)}</pre>
        <h2>引用</h2>
        ${hits}
        <label>修改稿（留空则使用上面的草稿）</label>
        <textarea id="edits" rows="4"></textarea>
        <button class="primary" id="approve">通过</button>
        <button class="danger" id="reject">驳回并升级</button>
        <p id="action-error" class="error"></p>
        <h2>节点</h2>
        <pre>${spans || "还没有节点记录。"}</pre>
      `;
      document.querySelectorAll("#queue li").forEach((li) => {
        li.className = li.dataset.id === ticketId ? "active" : "";
      });
      document.querySelectorAll("#closed li").forEach((li) => { li.className = ""; });
      document.getElementById("approve").onclick = () => decide(true);
      document.getElementById("reject").onclick = () => decide(false);
    }

    async function decide(approved) {
      if (!reviewToken) {
        document.getElementById("action-error").textContent = "请先登录领取人员令牌。";
        return;
      }
      const edits = document.getElementById("edits").value.trim();
      const response = await fetch("/runs/human", {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ ticket_id: selected, approved, edits: edits || null })
      });
      const result = await response.json();
      if (response.status === 401) {
        showAuth(result);
        return;
      }
      if (!response.ok || result.status === "not_found") {
        document.getElementById("action-error").textContent = (result.errors || ["提交失败"]).join(" ");
        return;
      }
      detail.innerHTML = `<h2>已处理</h2><p>${esc(selected)} → ${esc(STATUS[result.status] || result.status)}</p><p class="meta">它现在在左侧「已处理」里，可以再送回待审。</p>`;
      selected = null;
      selectedKind = null;
      await load();
      await loadClosed();
    }

    async function waitForRun(traceId) {
      detail.innerHTML = "<h2>处理中</h2><p class=\"meta\">正在分类和起草。</p>";
      for (let attempt = 0; attempt < 240; attempt += 1) {
        const response = await fetch("/runs/" + encodeURIComponent(traceId), { headers: serviceHeaders() });
        if (!response.ok) return await response.json().catch(() => ({}));
        const body = await response.json();
        if (body.status !== "running") return body;
        await new Promise((resolve) => setTimeout(resolve, 500));
      }
      return null;
    }

    document.getElementById("create").onclick = async () => {
      const error = document.getElementById("create-error");
      error.textContent = "";
      const response = await fetch("/runs", {
        method: "POST",
        headers: serviceHeaders(),
        body: JSON.stringify({
          ticket: {
            ticket_id: "ui-" + Date.now(),
            subject: document.getElementById("subject").value,
            body: document.getElementById("body").value
          }
        })
      });
      const created = await response.json().catch(() => ({}));
      if (!response.ok) {
        error.textContent = serviceError(created);
        return;
      }
      let settled = created;
      if (created.status === "running") {
        settled = await waitForRun(created.trace_id);
        if (!settled) {
          error.textContent = "运行没有在时限内结束";
          return;
        }
        const code = (settled.errors || [])[0];
        if (code === "service_auth_failed" || code === "service_auth_not_configured") {
          error.textContent = serviceError(settled);
          return;
        }
      }
      if (settled.status === "failed") {
        error.textContent = (settled.errors || ["运行失败"]).join(" ");
        return;
      }
      await load();
      if (settled.awaiting_human) show(settled.ticket_id);
    };

    load();
    loadClosed();
  </script>
</body>
</html>
