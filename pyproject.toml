[project]
name = "ticket-triage-agent"
version = "0.1.0"
description = "LangGraph 工单分流 Agent（HITL + MCP 工具面）— AI Agent 工程师作品集"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[project.scripts]
ticket-triage-api = "ticket_triage.api.main:run"
ticket-triage-mcp = "mcp_server.__main__:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ticket_triage*", "mcp_server*"]

[tool.setuptools.package-data]
ticket_triage = ["api/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: 需要拉起 MCP stdio 子进程的集成测试",
]

[tool.ruff]
line-length = 100
target-version = "py311"
